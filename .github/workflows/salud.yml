# Dead-man's switch del sistema. Corre salud_sistema() (migración 056/059) cada hora, más los tres
# vigías que no entran en vercel.json: cajas de catálogo ML (/api/salud/cajas), rechazos de ads
# (/api/monitor/ad-review) y estado de las cuentas de Meta (/api/salud/cuentas).
#
# El canal de alerta es la propia corrida: si hay algo ROJO el job FALLA y GitHub manda el mail.
# Sin infra nueva, sin n8n, sin webhooks — reusa el secret DATABASE_URL del backup.
#
# ROJO falla (sync frenado, sync con error, ads en $0) · AMARILLO solo queda en el resumen:
# la atribución lleva rota desde el 08/07 y depende de un fix upstream, así que si también
# fallara el job mandaría un mail por hora hasta que se arregle y en una semana nadie lo mira.
name: salud

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar salud_sistema()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          test -n "$DATABASE_URL" || { echo "::error::falta el secret DATABASE_URL"; exit 1; }
          # psql 16 del runner contra server 17: para consultas es compatible (a diferencia de pg_dump).
          psql "$DATABASE_URL" -At -F'|' -c \
            'select severidad, area, detalle from salud_sistema() order by severidad, area' > salud.txt

          rojos=$(grep -c '^ROJO|' salud.txt || true)
          amarillos=$(grep -c '^AMARILLO|' salud.txt || true)

          {
            echo "## Salud del sistema"
            if [ ! -s salud.txt ]; then echo "✅ Todo sano."; else
              echo ""
              while IFS='|' read -r sev area det; do
                [ -n "$sev" ] && echo "- **${sev}** · \`${area}\` — ${det}"
              done < salud.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          cat salud.txt
          echo "rojos=$rojos · amarillos=$amarillos"
          if [ "$rojos" -gt 0 ]; then
            grep '^ROJO|' salud.txt | while IFS='|' read -r _ area det; do
              echo "::error title=$area::$det"
            done
            exit 1
          fi

      # Corre aunque el paso anterior haya fallado: un rojo de DB no debe tapar una caja perdida.
      - name: Vigía cajas de catálogo ML
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "::error::falta el secret CRON_SECRET"; exit 1; }
          resp=$(curl -sfS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
            "https://biolabs-finanzas.vercel.app/api/salud/cajas") \
            || { echo "::error title=cajas-ml::/api/salud/cajas no respondió"; exit 1; }
          echo "$resp"

          {
            echo "## Cajas de catálogo ML"
            echo "$resp" | jq -r '.cajas[] | "- \(if .ok then "🟢" else "🔴" end) **\(.caja)** — \(.estados | to_entries | map("\(.key): \(.value)") | join(" · "))"'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$(echo "$resp" | jq -r .rojo)" = "true" ]; then
            echo "$resp" | jq -r '.cajas[] | select(.ok | not) | "::error title=caja \(.caja) perdida::\(.estados | tojson)"'
            exit 1
          fi

      # Monitor de rechazos de Meta CADA HORA (ítem P0 del vault: a 1×/día un rechazo
      # de las 10:05 se atendía al día siguiente). Va acá y no en vercel.json porque el
      # plan Hobby de Vercel rechaza crons de frecuencia mayor a diaria — el deploy
      # entero fallaba. Un ad rechazado NUEVO falla el job → GitHub manda el mail.
      - name: Monitor de rechazos de ads (Meta)
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "::error::falta el secret CRON_SECRET"; exit 1; }
          resp=$(curl -sfS --max-time 90 -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "https://biolabs-finanzas.vercel.app/api/monitor/ad-review") \
            || { echo "::error title=ad-review::/api/monitor/ad-review no respondió"; exit 1; }
          echo "$resp" | jq -c '{accounts, open, warnings}'

          # familia (§060) = el veredicto que antes había que ir a buscar al Graph a mano:
          # CONTENIDO → reescribir el creativo (motivo = la política citada).
          # ENTIDAD   → el mismo creativo está ACTIVE en otro adset: recrear y listo.
          abiertos=$(echo "$resp" | jq -r '.open // 0')
          {
            echo "## Rechazos de ads (Meta)"
            if [ "$abiertos" = "0" ]; then echo "✅ Sin ads rechazados abiertos."; else
              echo "$resp" | jq -r '.issues[] | "- 🔴 **\(.ad_name)** · \(.campaign_name) · \(.effective_status) · **\(.familia)**\(if .motivo then " — " + .motivo else "" end) · desde \(.first_seen_at)"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Solo fallan los rechazos NUEVOS de esta última hora — un issue viejo ya
          # avisado no puede mandar un mail por hora hasta que alguien lo resuelva.
          nuevos=$(echo "$resp" | jq -r '[.issues[] | select((.first_seen_at | fromdateiso8601? // 0) > (now - 3900))] | length')
          if [ "${nuevos:-0}" -gt 0 ]; then
            echo "$resp" | jq -r '.issues[] | select((.first_seen_at | fromdateiso8601? // 0) > (now - 3900)) | "::error title=\(.familia) · ad rechazado \(.ad_name)::\(.campaign_name) · \(.effective_status) · \(.motivo // "sin issues_info → mismo creativo vivo en otro adset, recrear como entidad nueva")"'
            exit 1
          fi

      # Vigía del account_status de las cuentas de Meta (§061). No existía: "la mejora pendiente más
      # útil" del Playbook-Contingencia §6. Al 30/07, de 54 cuentas visibles 11 están UNSETTLED y 10
      # DISABLED, y toda la operación cuelga de UNA sola ACTIVE. Acá y no en vercel.json por lo mismo
      # que el paso de arriba: Hobby rechaza los crons no diarios y voltea el deploy entero.
      - name: Estado de las cuentas de Meta
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "::error::falta el secret CRON_SECRET"; exit 1; }
          resp=$(curl -sfS --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "https://biolabs-finanzas.vercel.app/api/salud/cuentas") \
            || { echo "::error title=cuentas-meta::/api/salud/cuentas no respondió"; exit 1; }
          echo "$resp" | jq -c '{rojo, cambios}'

          {
            echo "## Cuentas de Meta"
            echo "$resp" | jq -r '.cuentas[] | "- \(if .status == "ACTIVE" then "🟢" else "🔴" end) **\(.name)** `\(.account_id)` — \(.status)\(if .prev_status then " · antes " + .prev_status else "" end)"'
          } >> "$GITHUB_STEP_SUMMARY"

          # Falla solo la TRANSICIÓN a no-ACTIVE (la ruta lo calcula con prev_status + changed_at):
          # una cuenta que ya está caída hace días no puede mandar un mail por hora.
          if [ "$(echo "$resp" | jq -r .rojo)" = "true" ]; then
            echo "$resp" | jq -r '.cambios[] | select(.status != "ACTIVE") | "::error title=cuenta \(.name) \(.status)::pasó de \(.prev_status) a \(.status)\(if .status == "UNSETTLED" then " — saldo impago, NO es sanción: se paga y vuelve, no quemes una cuenta de respaldo" else " — baneo real: rotar a la de respaldo (env en Vercel + backfill del período ciego + redeploy)" end)"'
            exit 1
          fi
